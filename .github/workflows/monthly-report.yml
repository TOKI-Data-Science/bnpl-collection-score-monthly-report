name: BNPL Collection Score Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  monthly-report:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DWH_USER: ${{ secrets.DWH_USER }}
      DWH_PASSWORD: ${{ secrets.DWH_PASSWORD }}
      DWH_DSN: ${{ secrets.DWH_DSN }}
      HIGH_SCORE_IS_RISK: "false"
      POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python report.py --output output/bnpl_collection_score_v1.html

      - name: Send report to Power Automate
        run: python send_to_power_automate.py output/bnpl_collection_score_v1.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bnpl-collection-score-${{ github.run_number }}
          path: output/bnpl_collection_score_v1.html
          if-no-files-found: warn
          retention-days: 90
