name: BNPL Collection Score Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  monthly-report:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    environment: production
    env:
      DWH_USER: ${{ secrets.DWH_USER }}
      DWH_PASSWORD: ${{ secrets.DWH_PASSWORD }}
      DWH_DSN: ${{ secrets.DWH_DSN }}
      HIGH_SCORE_IS_RISK: "false"
      POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
    steps:
      - name: Create report output directory
        run: mkdir -p output

      - name: Generate and send report
        run: |
          docker run --rm \
            --env DWH_USER \
            --env DWH_PASSWORD \
            --env DWH_DSN \
            --env HIGH_SCORE_IS_RISK \
            --env POWER_AUTOMATE_URL \
            --volume "${{ github.workspace }}/output:/app/output" \
            collection-score-report:latest

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bnpl-collection-score-${{ github.run_number }}
          path: output/bnpl_collection_score_v1.html
          if-no-files-found: warn
          retention-days: 90
