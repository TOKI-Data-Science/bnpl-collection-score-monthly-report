name: Build Production Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "collection-score-report:${GITHUB_REF_NAME}" \
            --tag collection-score-report:latest \
            .

      - name: Verify production entrypoint
        run: docker run --rm collection-score-report:latest python script.py --dry-run